[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/maxpluslab/tiling-solvers"

[workspace.dependencies]
tiling-core = { path = "crates/tiling-core" }
tiling-geometry = { path = "crates/tiling-geometry" }
tiling-search = { path = "crates/tiling-search" }
pyo3 = { version = "0.30", features = ["abi3-py311"] }
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

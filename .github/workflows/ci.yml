name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Rust format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --exclude tiling-py --locked

      - name: Build extension and install Python dependencies
        run: uv sync --locked

      - name: Ruff
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Pyright
        run: uv run pyright

      # The fixtures name the source commit they were imported from. Check that
      # commit out so the suite can regenerate them and compare.
      - name: Read the pinned source commit
        id: source
        shell: bash
        run: echo "commit=$(uv run python scripts/import_fixtures.py --print-source-commit)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: maxpluslab/tropical-puzzle-lab
          ref: ${{ steps.source.outputs.commit }}
          path: tropical-puzzle-lab

      - name: Python tests
        run: uv run pytest
        env:
          HYPOTHESIS_PROFILE: ci
          TROPICAL_PUZZLE_LAB: ${{ github.workspace }}/tropical-puzzle-lab

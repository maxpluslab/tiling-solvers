name = "corpus"
description = """
Every registered solver on the whole corpus, each search run to its end where it can be.
The two searches that would not end, cor1-flat's, stop at a node limit well above what
any other corpus puzzle needs (new1-flat: 1 064 878), so that where they stop does not
depend on the machine.
`maxplus-bench run benchmarks/manifests/corpus.toml --no-times` reproduces
benchmarks/results/corpus.md; a test holds the two together on every fixture but the
expensive footprints (tests/support/corpus.py), whose rows only this command checks.
"""
fixtures = ["corpus"]

# The Rust contact search, each puzzle in its own regime.
[[runs]]
solver = "rust.contact_dfs"

[runs.options]
node_limit = 1500000

# CP-SAT choosing among the placements that search reaches. Not the Pleat footprints:
# their listing stops at the node limit, and CP-SAT would then enumerate every assembly of
# the placements listed, far more than the 26 998 to 95 344 the search finds by the limit.
[[runs]]
solver = "cp_sat.placements"
fixtures = [
    "cor1", "cor1-flat", "new1", "new1-flat", "new2", "new2-flat", "new3", "new3-flat",
    "new4", "new4-flat", "new5", "new5-flat", "plt1", "plt2", "plt3", "plt4", "plt5",
    "rat1", "rat1-flat", "rat2", "rat2-flat", "rev2", "rev2-flat",
]

[runs.options]
node_limit = 1500000

# The Python prototype knows footprints only, and counts every orientation of the tray.
# It is given a node limit, not a time limit, so that where it stops does not depend on
# the machine: the three largest puzzles are beyond it.
[[runs]]
solver = "python.contact_dfs"
mode = "footprint"
fixtures = [
    "new1-flat", "new2-flat", "new3-flat", "new4-flat",
    "new5-flat", "rat1-flat", "rat2-flat", "rev2-flat",
]

[runs.options]
node_limit = 50000

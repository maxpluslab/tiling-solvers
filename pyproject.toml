[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "maxplus-solvers"
version = "0.1.0"
description = "A solver laboratory for geometric tiling puzzles: shared Rust geometry, interchangeable solvers, built-in benchmarking"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The independent solution validator. The solvers do not need it.
validate = ["shapely>=2.0"]

[project.urls]
Repository = "https://github.com/maxpluslab/tiling-solvers"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "jsonschema>=4.20",
    "maturin>=1.9,<2",
    "pyright>=1.1.400",
    "pytest>=8",
    "ruff>=0.9",
    "shapely>=2.0",
]

[tool.maturin]
python-source = "python"
module-name = "maxplus_solvers._native"
manifest-path = "crates/tiling-py/Cargo.toml"
features = ["pyo3/extension-module"]

[tool.uv]
# Rebuild the native extension on `uv sync` / `uv run` when Rust sources change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests` is on the path so suites can import the shared helpers as `support`.
pythonpath = ["tests"]
addopts = "--import-mode=importlib --strict-markers --strict-config -ra"
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "source: needs a checkout of tropical-puzzle-lab (skipped locally if absent, required in CI)",
    "slow: takes more than a few seconds",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["python", "tests", "scripts"]
# CI checks the source corpus out inside the workspace.
extend-exclude = ["tropical-puzzle-lab"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["python", "tests", "scripts"]
extraPaths = ["tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
